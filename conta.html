<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Youtube2</title>
    <link rel="stylesheet" href="style.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <header class="head">
      <button id="btn.menu"><i class="fa-solid fa-bars"></i></button>
      <div class="youtube-container">
        <i class="fa-brands fa-youtube youtube-logo"></i>
        <span class="youtube-text">Youtube2</span>
      </div>

      <div class="dropdown">
        <img
          class="dropbtn"
          onclick="myFunction()"
          src="imagens/perfil-homemaranha.jpg"
          alt="logo usuario"
        />
        <div id="myDropdown" class="dropdown-content">
          <a href="conta.html"><i class="fa-solid fa-user"></i>Conta</a>
          <a href="config.html"
            ><i class="fa-solid fa-gear"></i>Configurações</a
          >
          <a href="leave.html"
            ><i class="fa-solid fa-right-from-bracket"></i>Sair</a
          >
        </div>
      </div>
    </header>

    <div class="main-conta">
      <div class="dados">
        <h1>Sua conta</h1>
        <p><b>Foto de perfil</b></p>
        <img
          src="imagens/perfil-homemaranha.jpg"
          class="perfil-conta"
          alt="foto-perfil"
        />
        <p><b>Nome:</b> Maria</p>
        <p><b>Nome de usuário:</b> @Maria007</p>
      </div>
    </div>

    <div class="overlay" id="overlay"></div>
    <aside class="menu" id="menu">
      <div class="menu-header">
        <p>Menu</p>
        <button class="btn-close" id="btn.close">
          <i class="fa-solid fa-x"></i>
        </button>
      </div>
      <div class="menu-buttons">
        <a href="home.html" class="menu-btn"
          ><i class="fa-solid fa-house"></i>Início</a
        >
        <a href="shorts.html" class="menu-btn"
          ><i class="fa-brands fa-youtube-shorts"></i>Shorts</a
        >
        <a href="subs.html" class="menu-btn"
          ><i class="fa-solid fa-inbox"></i>Inscrições</a
        >
        <a href="history.html" class="menu-btn"
          ><i class="fa-solid fa-clock-rotate-left"></i>Histórico</a
        >
      </div>
    </aside>
    <script src="script.js"></script>
  </body>
</html>
