<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Youtube2</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <header class="head">
      <button id="btn.menu"><i class="fa-solid fa-bars"></i></button>
      <i class="fa-brands fa-youtube youtube-logo" style="color: rgb(255, 0, 0)"></i>
      <input class="search-bar" type="text" />
      <img src="" alt="logo usuario" />
    </header>

    <div class="main">
      <div class="video-box">
        <img src="imagens/homemaranha.avif" alt="img-video" class="img-video" />
        <p class="video-title">titulo do video</p>
        <div class="video-user">
          <div class="user">
            <img src="imagens/usuario.avif" alt="img-usuario" />
            <div class="user-description">
              <p class="user-name">nome do usuário</p>
              <p class="user-subs">inscrito</p>
            </div>
          </div>
          <button class="subscribe">inscreva-se</button>
        </div>
      </div>
    </div>

    <div class="overlay" id="overlay"></div>
    <aside class="menu" id="menu">
      <div class="menu-header">
        <p>Menu</p>
        <button class="btn-close" id="btn.close"><i class="fa-solid fa-x"></i></button>
      </div>
      <button><i class="fa-solid fa-house"></i>Home Page</button>
    </aside>
  </body>
</html>
